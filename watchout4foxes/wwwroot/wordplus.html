<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Random Word Generator - Word+ | watchout4foxes</title>
    <meta name="viewport" content="initial-scale=1.0,width=device-width">
    <link href="css/Site.css" rel="stylesheet" type="text/css">
    <link rel="preload" as="image" href="images/wo4foxesBanner.png">
    <link rel="preload" as="image" href="images/bannerFillRight.png">
    <link rel="preload" as="image" href="images/wo4snakesBG.png">
</head>
<body>
<div class="bannerContainer">
    <div class="bannerFillLeft"></div>
    <div class="banner">
        <a href="index.html">
            <img src="images/wo4foxesBanner.png" width="926" height="145" alt="watchout4foxes">
        </a>
    </div>
    <div class="bannerFillRight"></div>
    <div class="bannerHandheld">watchout4foxes</div>
    <div class="menubar">
        <a href="word.html">Word</a>
        <a href="wordplus.html">Word+</a>
        <a href="phrase.html">Phrase</a>
        <a href="sentence.html">Sentence</a>
        <a href="paragraph.html">Paragraph</a>
    </div>
</div>

<div class="mainBody">
    <div class="content">
        <h2>Word+</h2>
        <hr class="layoutRule">
        <div class="resultContainer">
            <div class="resultBox">
                <table class="centeredResult">
                    <tbody>
                    <tr>
                        <td><span id="result"></span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <hr class="layoutRule">
        <div class="formContainer">
            <form id="frmWord" method="post">
                <p><input type="submit" value="Refresh"></p>
                <p>
                    Word Type:
                    <select id="Pos" name="Pos">
                        <option value="n" selected="selected">Noun</option>
                        <option value="a">Adjective</option>
                        <option value="t">Verb (Transitive)</option>
                        <option value="i">Verb (Intransitive)</option>
                        <option value="e">Adverb</option>
                        <option value="z">Interjection</option>
                        <option value="s">Preposition</option>
                    </select>
                    <span class="spacer">&nbsp;</span>
                    Complexity:
                    <select id="Level" name="Level">
                        <option value="10">Very Common</option>
                        <option value="20">Common</option>
                        <option value="35" selected="selected">Average</option>
                        <option value="50">Somewhat Uncommon</option>
                        <option value="60">Uncommon</option>
                        <option value="70">Very Uncommon</option>
                        <option value="95">Obscure</option>
                    </select>
                </p>
            </form>
        </div>
        <div style="font-size: 0.75em; color: #888; margin-top: 35px; text-align: center;">
            watchout4foxes - A tribute to watchout4snakes. Kon kon.
        </div>
    </div>
</div>

<script src="js/jquery.min.js" type="text/javascript"></script>
<script src="js/engine.js" type="text/javascript"></script>
</body>
</html>
