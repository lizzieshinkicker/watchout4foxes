name: Deploy watchout4foxes to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'watchout4foxes/wwwroot'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Clean up old deployments
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching deployment history for ${{ github.repository }}..."
          DEPLOYMENTS=$(gh api "repos/${{ github.repository }}/deployments?per_page=100" --jq '.[1:][].id')
          for id in $DEPLOYMENTS; do
            echo "Pruning stale deployment ID: $id"
            gh api -X POST "repos/${{ github.repository }}/deployments/$id/statuses" -f state=inactive >/dev/null 2>&1 || true
            gh api -X DELETE "repos/${{ github.repository }}/deployments/$id" >/dev/null 2>&1 || true
          done
          echo "Old deployments successfully purged!"